name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Lint (eslint)
        run: pnpm run lint

      - name: Build extension
        run: pnpm run build

      - name: Check manifest not dirtied by build (package.json is source of truth)
        run: |
          if ! git diff --quiet manifest.json; then
            echo "::error::manifest.json was mutated by build. package.json is the source of truth; build must not sed -i the tracked file."
            git diff manifest.json
            exit 1
          fi
          PKG_VER=$(jq -r .version package.json)
          echo "package.json version: $PKG_VER (manifest.json may lag; publish workflow syncs at tag time)"

      - name: Lint extension (web-ext)
        run: npx --yes web-ext lint --source-dir .

  # Installs the extension in Firefox, clicks its toolbar button on a real
  # page and checks the downloaded file. ubuntu-22.04 on purpose: Ubuntu
  # 24.04 ships Firefox as a snap, which cannot use a custom profile dir.
  e2e-firefox:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build extension
        run: pnpm run build

      - uses: astral-sh/setup-uv@v5

      - name: Firefox end-to-end check
        run: uv run --with marionette_driver python tests/e2e/firefox_e2e.py
